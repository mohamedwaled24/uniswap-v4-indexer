services:
  envio-postgres:
    image: postgres:17.5
    restart: always
    ports:
      - "5432:5432"  # Exposed for external access if needed
    volumes:
      - envio-indexer-storage:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: envio-dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    networks:
      - envio-indexer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d envio-dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  graphql-engine:
    image: hasura/graphql-engine:v2.43.0
    ports:
      - "8080:8080"  # Removed localhost binding for external access
    depends_on:
      envio-postgres:
        condition: service_healthy
    restart: always
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgres@envio-postgres:5432/envio-dev
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-true}
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_NO_OF_RETRIES: 10
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
      # Security settings for production
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_CORS_DOMAIN: "*"
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - envio-indexer-network

  envio-indexer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9898:9898"  # Removed localhost binding for external access
    depends_on:
      graphql-engine:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"  # Increased for production
          memory: 1024M  # Increased for production
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: always
    environment:
      # Database settings
      ENVIO_PG_PASSWORD: postgres
      ENVIO_PG_HOST: envio-postgres
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: postgres
      ENVIO_PG_DATABASE: envio-dev
      ENVIO_PG_PUBLIC_SCHEMA: envio
      ENVIO_PG_SSL_MODE: false
      ENVIO_POSTGRES_PASSWORD: postgres
      
      # Indexer settings
      ENVIO_INDEXER_HOST: 0.0.0.0
      ENVIO_INDEXER_PORT: 9898
      CONFIG_FILE: config.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}  # Changed from trace to info for production
      LOG_STRATEGY: console-pretty
      TUI_OFF: true
      
      # Hasura settings
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_SERVICE_HOST: graphql-engine
      HASURA_SERVICE_PORT: 8080
      
      # Application settings
      NODE_ENV: production
      METRICS_PORT: 9090
      
      # All your RPC URLs will come from .env file
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN}
      ENVIO_MAINNET_RPC_URL: ${ENVIO_MAINNET_RPC_URL}
      ENVIO_ARBITRUM_RPC_URL: ${ENVIO_ARBITRUM_RPC_URL}
      ENVIO_BASE_RPC_URL: ${ENVIO_BASE_RPC_URL}
      ENVIO_POLYGON_RPC_URL: ${ENVIO_POLYGON_RPC_URL}
      ENVIO_AVALANCHE_RPC_URL: ${ENVIO_AVALANCHE_RPC_URL}
      ENVIO_BSC_RPC_URL: ${ENVIO_BSC_RPC_URL}
      ENVIO_BLAST_RPC_URL: ${ENVIO_BLAST_RPC_URL}
      ENVIO_ZORA_RPC_URL: ${ENVIO_ZORA_RPC_URL}
      ENVIO_SONIEUM_RPC_URL: ${ENVIO_SONIEUM_RPC_URL}
      ENVIO_UNICHAIN_RPC_URL: ${ENVIO_UNICHAIN_RPC_URL}
      ENVIO_INK_RPC_URL: ${ENVIO_INK_RPC_URL}
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9898' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # Longer start period for indexer
    networks:
      - envio-indexer-network

volumes:
  envio-indexer-storage:
    driver: local

networks:
  envio-indexer-network:
    driver: bridge